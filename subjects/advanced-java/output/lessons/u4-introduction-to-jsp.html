<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Introduction to JSP – CACS354</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap"><style>/* Study Hero – calm, one-step-at-a-time look (after the StudyForge wireframes):
   white page, near-black ink, serif titles, hairline rows, one black primary button.

:root{--bg:#fff;--ink:#141414;--mut:#5c5c5c;--line:#e4e4e0;--soft:#f6f6f3;--btn:#141414;--btnink:#fff;
 --hl:#fff1b8;--hlink:#7a4b00;--blue:#1d4ed8;--green:#15803d;--red:#b91c1c;--okbg:#dcfce7;--nobg:#fee2e2;

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--ink:#f4f4f2;--mut:#b4b4ae;--line:#2e2e2b;--soft:#1c1c1a;--btn:#f4f4f2;--btnink:#121212;--hl:#3d3200;--hlink:#ffd666;--blue:#8fb2ff;--green:#5fd38a;--red:#ff8a8a;--okbg:#123d22;--nobg:#4a1616;--code:#0b0c0e;--codeon:#33437a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--ink:#f4f4f2;--mut:#b4b4ae;--line:#2e2e2b;--soft:#1c1c1a;--btn:#f4f4f2;--btnink:#121212;--hl:#3d3200;--hlink:#ffd666;--blue:#8fb2ff;--green:#5fd38a;--red:#ff8a8a;--okbg:#123d22;--nobg:#4a1616;--code:#0b0c0e;--codeon:#33437a;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans)}
a{color:var(--ink)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,8vw,40px);line-height:1.12}
h2{font-size:clamp(24px,6.4vw,30px);line-height:1.2}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- lesson: top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:52px}
.icon{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:none;cursor:pointer;text-decoration:none;font-size:20px;border-radius:10px}
.icon:hover{background:var(--soft)}
.top .t{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.secs{display:flex;gap:16px;overflow-x:auto;padding:10px 0 0;font-size:13px;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.secs span{white-space:nowrap;color:var(--mut);padding-bottom:6px;border-bottom:2px solid transparent}
.secs span.done{color:var(--ink)}.secs span.on{color:var(--ink);font-weight:700;border-color:var(--ink)}

/* ---------- lesson: one step ---------- */
main{padding-top:22px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.step{display:flex;flex-direction:column;gap:16px;min-width:0;overflow-wrap:anywhere}
.step p{margin:0}
.lead{font-size:19px;line-height:1.55}
.say{font-size:20px;line-height:1.5;font-weight:500}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;gap:12px;align-items:flex-start}
.row b.k{flex:0 0 70px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-top:3px}
.chain{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chain>div{padding:12px 16px}.chain>div+div{border-top:1px solid var(--line)}.chain .now{background:var(--soft);font-weight:600}
.trick{background:var(--hl);border-radius:12px;padding:14px 16px}
.trick .eyebrow{color:var(--hlink)}
.trick big{display:block;font-family:var(--serif);font-size:23px;line-height:1.35;font-weight:600;margin-top:4px}
.trick big b{color:var(--hlink);text-decoration:underline;text-underline-offset:3px}
.ans ul,.ans ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.ans p{margin:0 0 8px}
.ans table,.scroll table{border-collapse:collapse;width:100%;font-size:15px}
.scroll{overflow-x:auto;max-width:100%}
td,th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}th{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--ink)}
pre{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:13.5px/1.5 var(--mono);max-width:100%;white-space:pre}
code{font-family:var(--mono);font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:4px}

/* story stage */
.stage{position:relative;height:clamp(220px,60vw,300px);border-radius:14px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.a{position:absolute;transform:translate(-50%,-50%);text-align:center;transition:left .9s ease,top .9s ease,opacity .4s,transform .35s;font-size:clamp(30px,8vw,52px);line-height:1}
.a small{display:block;font:700 clamp(10px,2.6vw,13px)/1.2 var(--sans);margin-top:4px;color:var(--ink)}
.a.glow{transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 8px #f5b301)}
.b{z-index:5;position:absolute;background:var(--bg);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:4px 10px;font:700 clamp(11px,3.2vw,14px)/1.3 var(--sans);white-space:nowrap;opacity:0;transition:opacity .3s}.b.on{opacity:1}
.dots{display:flex;gap:6px}.dots b{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots b.on{background:var(--ink)}

/* code trace */
.code{background:var(--code);color:var(--codeink);border-radius:12px;padding:8px 0;font:12.5px/1.75 var(--mono);max-height:36vh;overflow:auto}
.code div{padding:0 12px;white-space:pre;border-left:4px solid transparent;width:max-content;min-width:100%}
.code div.on{background:var(--codeon);border-left-color:#f5b301;color:#fff}
.code div i{color:#7b8190;font-style:normal;display:inline-block;width:26px}
.user{border:1.5px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;align-self:flex-start}
.win{border:2px solid #4b5563;border-radius:8px;background:#fff;color:#111;overflow:hidden;font-size:14px}
.win .tb{background:#4b5563;color:#fff;padding:3px 8px;display:flex;justify-content:space-between}
.win .bd{padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:56px}
.win.off{border-style:dashed;background:transparent;color:var(--mut);text-align:center;padding:14px}
.win input{width:90px;border:1px solid #888;padding:2px 4px;font-size:14px;background:#fff;color:#111}.win .bt{border:1px solid #888;background:#e5e7eb;border-radius:4px;padding:2px 8px}
.mem{font:13px/1.5 var(--mono)}
.con{font:13px var(--mono);background:#000;color:#4ade80;border-radius:8px;padding:6px 10px}

/* quiz */
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--ink)}
.opt.ok{background:var(--okbg);border-color:var(--green)}.opt.no{background:var(--nobg);border-color:var(--red)}
.fb{font-weight:600}

/* bottom bar */
.bot{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bot .wrap{display:flex;gap:10px;padding-block:12px}
.btn{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--btn);background:var(--btn);color:var(--btnink);font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;text-align:center}
.btn.ghost{flex:0 0 auto;background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.35;cursor:default}

/* ---------- home ---------- */
.home{padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
.brand{font-weight:700;font-size:17px}
.cont{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cont .btn{flex:none}
.unit{border-top:1px solid var(--line)}
.unit summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;gap:12px;align-items:baseline}
.unit summary::-webkit-details-marker{display:none}
.unit summary h2{font-size:22px;flex:1}
.unit summary .mut{font-size:14px;white-space:nowrap}
.unit summary::after{content:"+";font-size:22px;color:var(--mut)}.unit[open] summary::after{content:"–"}
.topics{list-style:none;margin:0 0 16px;padding:0}
.topics a{display:flex;gap:14px;align-items:baseline;padding:13px 0;text-decoration:none;border-top:1px solid var(--line);min-height:48px}
.topics .n{flex:0 0 26px;font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.topics .tt{flex:1;min-width:0}
.topics .tag{font-size:12px;color:var(--mut);white-space:nowrap}
.topics a.done .n::before{content:"✓ ";color:var(--green)}
.topics a.sub{padding-left:40px}
.files a{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);text-decoration:none}
.files a span:last-child{color:var(--mut);font-size:14px}

// ---- tricks: topic trick first, the "points" trick goes with the points, a "list/table" trick with the table
const tricks=C.mn.map(([label,html])=>({label,html,used:false}));

 const st=$('stage');const prev=k>0?C.scenes[k-1]:null;

  const from=prev?((prev.mv&&prev.mv[id])||[a.x,a.y]):[a.x,a.y];d.style.left=from[0]+'%';d.style.top=from[1]+'%';d.style.opacity=prev&&prev.show.includes(id)?1:0;st.appendChild(d);

// exam answer: split by heading, one part per step; big tables get their own step

  cur.html+=n.nodeName==='TABLE'?`<div class="scroll">${n.outerHTML}</div>`:(n.outerHTML||esc(n.textContent))}
 parts.forEach((p,k)=>{let t='';
  if(/point|role|feature|advantage|step|type/i.test(p.title))t=trickHTML(takeTrick(/point|answer/i));
  if(/table|list|type/i.test(p.title))t+=trickHTML(takeTrick(/list|table|type/i));
  add('Exam answer',`<div class="eyebrow">Write this in the exam · ${k+1} of ${parts.length}</div><h2>${p.title}</h2><div class="ans">${p.html}</div>${t}`)})})();

// leftover tricks + quick check + finish
const left=tricks.filter(x=>!x.used);
if(left.length)add('Remember',`<div class="eyebrow">Remember</div><h2>Say these out loud once</h2>${left.map(trickHTML).join('')}`);
add('Check',`<div class="eyebrow">Quick check</div><h2>${C.q[0]}</h2><div class="step" style="gap:10px">${C.q[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><p class="fb" id="fb" aria-live="polite"></p>`,el=>{
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===C.q[2];b.classList.add(ok?'ok':'no');snd(ok?'ding':'err');
  $('fb').innerHTML=ok?'Correct. '+C.q[3]:'Not this one. Try another.'})});
add('Done',`<div class="eyebrow">Topic done</div><h1>Nice. ${C.tab} is finished.</h1><p class="lead">${NAV.next?`Next topic: <b>${esc(NAV.next.title)}</b>`:'This was the last topic. Open EXAM-RESCUE from the home page.'}</p><p class="mut">Want it again later? It is in the PDF for this unit too.</p><p class="mut" style="font-size:13px">${esc(C.src||'')}</p>`,()=>{snd('ding');try{localStorage.setItem('sh:done:'+location.pathname.split('/').pop(),'1')}catch(e){}});

// ---- section chips
const secs=[...new Set(steps.map(s=>s.sec))];
$('secs').innerHTML=secs.map(s=>`<span data-s="${s}">${s}</span>`).join('');

// ---- player
let i=0;
function show(n){i=Math.max(0,Math.min(steps.length-1,n));const s=steps[i],el=$('step');
 if(s.html!==null)el.innerHTML=s.html;if(s.enter)s.enter(el);
 $('count').textContent=`${i+1} / ${steps.length}`;$('bar').style.width=((i+1)/steps.length*100)+'%';
 const si=secs.indexOf(s.sec);$('secs').querySelectorAll('span').forEach((x,k)=>{x.className=k==si?'on':k<si?'done':'';if(k==si)x.scrollIntoView({block:'nearest',inline:'center'})});
 $('back').disabled=i==0;
 const nx=$('next');
 if(i==steps.length-1){nx.textContent=NAV.next?'Next topic →':'Back to all topics';nx.onclick=()=>location.href=NAV.next?NAV.next.href:NAV.home}
 else{nx.textContent=i==0?'Start →':'Next →';nx.onclick=()=>{if(s.sec!=='Story'&&s.sec!=='Code')snd('tick');show(i+1)}}
 try{history.replaceState(null,'','#s'+(i+1))}catch(e){}window.scrollTo(0,0);
 try{localStorage.setItem('sh:last',JSON.stringify({href:location.pathname.split('/').pop(),title:C.tab,step:i}))}catch(e){}}
$('back').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft'&&i>0)show(i-1)});
window.addEventListener('hashchange',()=>{const m=+(location.hash.match(/^#s(\d+)$/)||[])[1];if(m&&m-1!==i)show(m-1)});
const h=+(location.hash.match(/^#s(\d+)$/)||[])[1];show(h?h-1:0);
</script></body></html>
