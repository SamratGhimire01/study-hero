<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Hero</title><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#16202c;--mut:#5b6877;--acc:#4f46e5;--g:#16a34a;--o:#ea580c;--line:#dde2ea;--hl:#fff3b0;--code:#0f172a;--codeink:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202a;--ink:#eaf0f6;--mut:#9aa7b5;--acc:#8b87ff;--line:#2a3441;--hl:#5a4b00}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:14px}h1{font-size:21px;margin:6px 0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top button{margin-left:auto}
.road{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}
.road button{flex:1 1 90px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 6px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;position:relative}
.road button.on{border-color:var(--acc);background:var(--acc);color:#fff}.road button.done{border-color:var(--g)}
.road button small{display:block;font-size:11px;opacity:.8}
.pg{display:none}.pg.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h2{margin:0 0 4px;font-size:20px}h3{margin:14px 0 4px;font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.step{display:inline-block;background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;font-size:14px;line-height:24px;margin-right:6px}
.link{background:var(--bg);border:1px dashed var(--acc);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.stage{position:relative;height:clamp(200px,52vw,270px);border-radius:12px;background:linear-gradient(#e9f0ff,#f9fbff);border:1px solid var(--line);overflow:hidden;color:#16202c}
@media(prefers-color-scheme:dark){.stage{background:linear-gradient(#1b2740,#141c2b);color:#eaf0f6}}
.a{position:absolute;transform:translate(-50%,-50%);text-align:center;transition:left 1s ease,top 1s ease,opacity .5s,transform .4s;font-size:clamp(26px,7vw,52px);line-height:1}
.a small{display:block;font-size:clamp(9px,2.4vw,13px);font-weight:700;margin-top:4px}
.a.glow{transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 10px #facc15)}
.b{z-index:5;position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;border:2px solid #333;border-radius:12px;padding:4px 10px;font-size:14px;font-weight:700;max-width:170px;text-align:center;opacity:0;transition:opacity .3s}.b.on{opacity:1}
.cap{margin:10px 0 2px;font-size:22px;font-weight:800}.sub{color:var(--mut);margin:0 0 8px;min-height:26px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
button.p,.ctl button,.top button{border:0;background:var(--acc);color:#fff;padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer}
.ctl button.s,.top button.s{background:var(--line);color:var(--ink)}
.dots{display:flex;gap:5px;margin-left:auto}.dots b{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots b.on{background:var(--acc)}
.mn{background:var(--hl);color:#111;border-radius:12px;padding:12px 14px;margin:10px 0;border-left:6px solid #eab308}
@media(prefers-color-scheme:dark){.mn{color:#fff}}
.mn big{font-size:21px;font-weight:800;display:block}.mn b{color:var(--o)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font:13.5px/1.45 ui-monospace,Menlo,monospace;margin:6px 0}
ul{padding-left:22px;margin:4px 0}.note{color:var(--mut);font-size:14px}
.q button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.q button.ok{background:#bbf7d0;color:#064e1f}.q button.no{background:#fecaca;color:#7f1d1d}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.9em}
/* code trace */
.tr{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}@media(max-width:700px){.tr{grid-template-columns:1fr}}
.code{background:var(--code);color:var(--codeink);border-radius:10px;padding:8px 0;font:13px/1.7 ui-monospace,Menlo,monospace;max-height:340px;overflow:auto}
.code div{padding:0 10px;white-space:pre;border-left:4px solid transparent}.code div.on{background:#4338ca;border-left-color:#facc15;color:#fff}
.code div i{color:#64748b;font-style:normal;display:inline-block;width:26px}
.side{display:flex;flex-direction:column;gap:8px}
.user{background:#ffedd5;color:#7c2d12;border:2px solid #fb923c;border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px;display:none}.user.on{display:block}
.say{background:var(--bg);border:2px solid var(--acc);border-radius:10px;padding:8px 10px;font-weight:600;min-height:64px}
.win{border:2px solid #475569;border-radius:8px;background:#fff;color:#111;overflow:hidden;font-size:14px}
.win .tb{background:#475569;color:#fff;padding:3px 8px;display:flex;justify-content:space-between}
.win .bd{padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:64px}
.win.off{border-style:dashed;background:transparent;color:var(--mut);text-align:center;padding:18px}
.win input{width:90px;border:1px solid #888;padding:2px 4px;font-size:14px;background:#fff;color:#111}.win .bt{border:1px solid #888;background:#e5e7eb;border-radius:4px;padding:2px 8px}
.mem{font:13px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:44px}
.con{font:13px ui-monospace,monospace;background:#000;color:#4ade80;border-radius:6px;padding:4px 8px;min-height:28px}
.hint{font-size:13px;color:var(--mut)}
/* mobile: never scroll sideways */
.card{min-width:0;overflow-wrap:anywhere}.tr>*{min-width:0}td,th,code,.mn big,.link{overflow-wrap:anywhere;word-break:break-word}
pre{max-width:100%}table{table-layout:auto}
.b{white-space:nowrap;font-size:clamp(11px,3.2vw,14px)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.nav a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--ink);text-decoration:none;font-size:15px}.road{display:none}a{color:var(--acc)}
.list li{margin:3px 0}.todo{color:var(--mut)}.ok{color:#16a34a;font-weight:700}</style></head><body><div class="w"><h1>📚 Study Hero</h1><p class="note">One section per subject. Open a subject to see its lessons, PDFs and papers.</p><div class="card"><h2><a href="subjects/advanced-java/output/index.html">Advanced Java Programming</a> <span class="note">CACS354</span></h2><p class="note">58 lesson cards · 57/57 topics ready</p></div></div></body></html>
